{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Ruta</h2>
    <p>¿Estás seguro que deseas eliminar la ruta: <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'bonanza_cobros:ruta_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
