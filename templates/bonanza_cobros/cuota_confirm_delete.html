{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Cuota</h2>
    <p>¿Estás seguro de que deseas eliminar esta cuota de <strong>{{ object.cliente.nombre }}</strong> por <strong>${{ object.valor|floatformat:0 }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'bonanza_cobros:cuota_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
