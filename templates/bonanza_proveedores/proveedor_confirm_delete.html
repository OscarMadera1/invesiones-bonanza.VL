{% extends 'base.html' %}

{% block title %}Eliminar proveedor{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>¿Estás seguro que deseas eliminar el proveedor "{{ proveedor }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'proveedores:lista_proveedores' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
