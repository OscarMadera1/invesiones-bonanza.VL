{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>¿Estás seguro que deseas eliminar la zona "{{ zona }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'zonas:lista_zonas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
