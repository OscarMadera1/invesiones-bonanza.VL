<!-- templates/bonanza_inventario/producto_list.html -->
{% extends 'base.html' %}

{% block title %}Productos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-box"></i> Lista de productos</h2>

<a href="{% url 'inventario:crear_producto' %}" class="btn btn-success mb-3"><i class="bi bi-plus-circle"></i> Nuevo Producto</a>
</div>
<table class="table table-striped table-hover datatable">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.descripcion }}</td>
            <td>
                <a href="{% url 'inventario:editar_producto' producto.pk %}" class="btn btn-sm btn-primary"><i
                        class="bi bi-pencil-square"></i></a>
                <a href="{% url 'inventario:eliminar_producto' producto.pk %}" class="btn btn-sm btn-danger"><i
                        class="bi bi-trash"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
