{% extends 'base.html' %}

{% block title %}Bodegas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-house"></i> Lista de Bodegas</h2>
<a href="{% url 'inventario:crear_bodega' %}" class="btn btn-success mb-3"><i class="bi bi-plus-circle"></i> Nueva Bodega</a>
</div>
<table class="table table-hover table-striped datatable">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Municipio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for bodega in bodegas %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ bodega.nombre }}</td>
            <td>{{ bodega.municipio.nombre }}</td>
            <td>
                <a href="{% url 'inventario:editar_bodega' bodega.pk %}" title="Editar" class="btn btn-sm btn-primary"><i
                        class="bi bi-pencil-square"></i></a>
                <a href="{% url 'inventario:eliminar_bodega' bodega.pk %}" title="Eliminar" class="btn btn-sm btn-danger"><i
                        class="bi bi-trash"></i></a>
                <a href="{% url 'inventario:crear_inventario_bodega' bodega.pk %}" title="Agregar producto" class="btn btn-sm btn-success"><i
                        class="bi bi-cart-plus-fill"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
