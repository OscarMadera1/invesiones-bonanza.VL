{% extends 'base.html' %}

{% block title %}Municipios{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-people"></i> Lista de municipios</h2>
        <a href="{% url 'inventario:crear_municipio' %}"  class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo municipio</a>
    </div>

<table class="table table-hover table-striped datatable table-responsive">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for municipio in municipios %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ municipio.nombre }}</td>
            <td>
                <a href="{% url 'inventario:editar_municipio' municipio.id %}" class="btn btn-sm btn-primary"><i class="bi bi-pencil-square"></i></a>
                <a href="{% url 'inventario:crear_inventario_bodega' municipio.id %}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function () {
        $('.datatable').DataTable({
            language: {
                url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            }
        });
    });
</script>
{% endblock %}
