{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Editar Empleado{% else %}Nuevo Empleado{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'empleado_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
