{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="alert alert-danger">
        <h4 class="alert-heading">¿Estás seguro?</h4>
        <p>Vas a eliminar al empleado <strong>{{ obj.nombre }}</strong>.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'empleados:lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
