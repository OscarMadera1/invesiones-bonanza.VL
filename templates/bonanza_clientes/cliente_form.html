{% extends 'base.html' %}

{% block title %}Formulario Cliente{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-person-lines-fill"></i> {% if form.instance.pk %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h2>
    <form method="post" class="card p-4 shadow-sm mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-end">
            <a href="{% url 'bonanza_clientes:cliente_list' %}" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
