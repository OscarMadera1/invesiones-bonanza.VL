{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger p-4 shadow-sm">
        <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill"></i> Confirmar eliminación</h4>
        <p>¿Estás seguro de que deseas eliminar al cliente <strong>{{ cliente.nombre }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-end mt-3">
                <a href="{% url 'bonanza_clientes:cliente_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
